name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

      # ─── Post-release summary ───────────────────────────────────────
      - name: Check if a release was made
        id: check_release
        run: |
          NEW_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Summary
        if: steps.check_release.outputs.tag != ''
        run: |
          echo "## 🚀 Released ${{ steps.check_release.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "Published to npm and GitHub Releases." >> $GITHUB_STEP_SUMMARY
